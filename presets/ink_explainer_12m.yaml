channel_name: "Ink of Ages"
channel_style: "ink_explainer_12m"

script:
  groq_model: "openai/gpt-oss-120b"
  unit_count: 6
  words_per_unit: 300
  target_words_per_scene: 45
  system_prompt: >
    You are an expert educational history and anthropology scriptwriter in the style of Ink Explainer.
    Write clear, fascinating, conversational, evidence-backed storytelling about how ancient humans lived.
    Avoid cliches and keep every scene visually concrete.

audio:
  voice_id: "af_bella"
  speed: 1.0
  sentence_pause_ms: 250

visuals:
  engine: "flux"
  model_id: "black-forest-labs/FLUX.1-schnell"
  steps: 4
  guidance_scale: 0.0
  width: 1280
  height: 720
  allowed_scene_types:
    - "character_scene"
    - "title_card"
    - "split_comparison"
  style_prefix: >
    A clean 2D vector style illustration in the aesthetic of a modern educational explainer video.
    Simple cartoon character with a round gray head, wide expressive eyes, thick black marker outlines,
    flat color fills, minimalist whiteboard animation style, clean lines, high contrast.

render:
  zoom_speed: 0.0008
  max_zoom: 1.15
  ffmpeg_post_filter: "eq=contrast=1.03:saturation=1.05"
  bg_color: [244, 241, 234]
  text_color: [24, 20, 22]
  accent_color: [236, 110, 30]
